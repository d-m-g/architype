[project]
name = "junction2026"
version = "0.0.0"
description = "Make Blueprints Talk: answer questions about construction drawings"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

# One group per lane, so nobody needs another lane's heavy packages to run eval.py.
# Add to your own group only. Install with: uv sync --extra parsers
[project.optional-dependencies]
parsers = ["ezdxf", "ifcopenshell", "pillow", "pymupdf", "shapely"]
detector = ["modal"]
brain = ["openai", "fastapi", "uvicorn", "pymupdf", "numpy", "pillow"]  # numpy, pillow: /api/alike compares page pixels
